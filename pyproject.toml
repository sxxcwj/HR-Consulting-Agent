[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-consultant-agent"
version = "1.0.0rc1"
description = "Terminal-based enterprise HR consultant agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.29.0,<3",
  "openpyxl>=3.1.0,<4",
  "pypdf>=6.0.0,<7",
  "python-docx>=1.2.0,<2",
  "python-dotenv>=1.0.0,<2",
  "sentence-transformers>=5.1.0,<6",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
hragent = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
